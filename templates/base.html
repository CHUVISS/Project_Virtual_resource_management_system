{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Виртуальные ресурсы{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="{% static 'homepage/css/style.css' %}"
    >
</head>
<body class="d-flex flex-column">
    {% include "includes/navigation.html" %}

    <main class="container flex-grow-1 py-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container d-flex flex-wrap justify-content-between gap-2">
            <span>
                © <span id="current-year"></span>
                Система управления виртуальными ресурсами
            </span>
            <span>Учебный проект · Django · JSON-хранилище</span>
        </div>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
